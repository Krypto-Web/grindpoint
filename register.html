<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2584816616413650"
     crossorigin="anonymous"></script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Account — Grindpoint</title>
  <meta name="description" content="Join Grindpoint free and start earning Naira today."/>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-box fade-up">
    <div class="auth-logo">
      <a href="index.html" class="logo">Grind<span>point</span></a>
    </div>
    <h2 class="auth-title">Create your account</h2>
    <p class="auth-sub">Free forever. Start earning Naira in minutes.</p>

    <div class="alert alert-error" id="error-msg"></div>
    <div class="alert alert-success" id="success-msg"></div>

    <div class="form-group">
      <label class="form-label">Full Name</label>
      <input type="text" id="name" class="form-input" placeholder="e.g. Chidi Okafor"/>
    </div>
    <div class="form-group">
      <label class="form-label">Email Address</label>
      <input type="email" id="email" class="form-input" placeholder="you@example.com"/>
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input type="password" id="password" class="form-input" placeholder="At least 6 characters"/>
    </div>
    <div class="form-group">
      <label class="form-label">Referral Code <span style="color:var(--muted);font-weight:400;">(optional)</span></label>
      <input type="text" id="referral" class="form-input" placeholder="e.g. AB12CD34" style="text-transform:uppercase"/>
    </div>

    <button class="btn btn-primary btn-block" id="register-btn" onclick="register()">
      Create Free Account
    </button>

    <hr class="divider"/>
    <p style="text-align:center;font-size:0.9rem;">Already have an account? <a href="login.html">Sign in</a></p>
  </div>
</div>

<script type="module">
  import { supabase } from './js/supabase.js'
  import { redirectIfLoggedIn, toast } from './js/app.js'

  redirectIfLoggedIn()

  // Pre-fill referral code from URL param
  const params = new URLSearchParams(window.location.search)
  if (params.get('ref')) {
    document.getElementById('referral').value = params.get('ref').toUpperCase()
  }

  window.register = async function () {
    const btn = document.getElementById('register-btn')
    const errorEl = document.getElementById('error-msg')
    const successEl = document.getElementById('success-msg')
    const name = document.getElementById('name').value.trim()
    const email = document.getElementById('email').value.trim()
    const password = document.getElementById('password').value
    const referral = document.getElementById('referral').value.trim().toUpperCase()

    errorEl.classList.remove('show')
    successEl.classList.remove('show')

    if (!name || !email || !password) {
      errorEl.textContent = 'Please fill in all required fields.'
      errorEl.classList.add('show')
      return
    }
    if (password.length < 6) {
      errorEl.textContent = 'Password must be at least 6 characters.'
      errorEl.classList.add('show')
      return
    }

    btn.disabled = true
    btn.innerHTML = '<span class="spinner"></span> Creating account...'

    // Sign up with Supabase Auth
    const { data, error } = await supabase.auth.signUp({
      email,
      password,
      options: { data: { name } }
    })

    if (error) {
      errorEl.textContent = error.message
      errorEl.classList.add('show')
      btn.disabled = false
      btn.textContent = 'Create Free Account'
      return
    }

    const userId = data.user.id

    // Generate referral code
    const myReferralCode = Math.random().toString(36).substring(2, 10).toUpperCase()

    // Insert user profile into users table
    await supabase.from('users').insert({
      id: userId,
      name,
      email: email.toLowerCase(),
      referral_code: myReferralCode,
      points: 0,
      streak_days: 0
    })

    // Handle referral
    if (referral) {
      const { data: referrer } = await supabase
        .from('users')
        .select('id')
        .eq('referral_code', referral)
        .single()

      if (referrer) {
        await supabase.from('referrals').insert({ referrer_id: referrer.id, referred_id: userId })
        // Award referrer 500 points
        await supabase.rpc('increment_points', { user_id: referrer.id, amount: 500 })
        await supabase.from('transactions').insert({
          user_id: referrer.id, type: 'earn', source: 'referral',
          points: 500, description: 'Referral bonus — friend joined'
        })
      }
    }

    // Award 100 bonus points for signing up
    await supabase.rpc('increment_points', { user_id: userId, amount: 100 })
    await supabase.from('transactions').insert({
      user_id: userId, type: 'earn', source: 'signup',
      points: 100, description: 'Welcome bonus'
    })

    successEl.textContent = '🎉 Account created! Check your email to verify, then log in.'
    successEl.classList.add('show')
    btn.textContent = 'Account Created!'
  }
</script>
</body>
</html>
