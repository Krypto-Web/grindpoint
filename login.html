<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2584816616413650"
     crossorigin="anonymous"></script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Grindpoint</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-box fade-up">
    <div class="auth-logo">
      <a href="index.html" class="logo">Grind<span>point</span></a>
    </div>
    <h2 class="auth-title">Welcome back</h2>
    <p class="auth-sub">Log in to continue earning.</p>

    <div class="alert alert-success" id="verified-msg" style="display:none;">
      ✅ Email verified! You've earned 100 bonus points. Log in now.
    </div>
    <div class="alert alert-error" id="error-msg"></div>

    <div class="form-group">
      <label class="form-label">Email Address</label>
      <input type="email" id="email" class="form-input" placeholder="you@example.com"/>
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input type="password" id="password" class="form-input" placeholder="Your password"/>
    </div>

    <button class="btn btn-primary btn-block" id="login-btn" onclick="login()">
      Log In
    </button>

    <hr class="divider"/>
    <p style="text-align:center;font-size:0.9rem;">Don't have an account? <a href="register.html">Sign up free</a></p>
  </div>
</div>

<script type="module">
  import { supabase } from './js/supabase.js'
  import { redirectIfLoggedIn } from './js/app.js'

  redirectIfLoggedIn()

  // Show verified message if coming from email verification
  if (new URLSearchParams(window.location.search).get('verified')) {
    document.getElementById('verified-msg').classList.add('show')
    document.getElementById('verified-msg').style.display = 'block'
  }

  // Allow Enter key to submit
  document.addEventListener('keydown', e => { if (e.key === 'Enter') login() })

  window.login = async function () {
    const btn = document.getElementById('login-btn')
    const errorEl = document.getElementById('error-msg')
    const email = document.getElementById('email').value.trim()
    const password = document.getElementById('password').value

    errorEl.classList.remove('show')

    if (!email || !password) {
      errorEl.textContent = 'Please enter your email and password.'
      errorEl.classList.add('show')
      return
    }

    btn.disabled = true
    btn.innerHTML = '<span class="spinner"></span> Logging in...'

    const { data, error } = await supabase.auth.signInWithPassword({ email, password })

    if (error) {
      errorEl.textContent = error.message === 'Invalid login credentials'
        ? 'Incorrect email or password.'
        : error.message
      errorEl.classList.add('show')
      btn.disabled = false
      btn.textContent = 'Log In'
      return
    }

    // Check streak on login
    const userId = data.user.id
    const { data: user } = await supabase
      .from('users')
      .select('last_login, streak_days')
      .eq('id', userId)
      .single()

    const now = new Date()
    const last = user?.last_login ? new Date(user.last_login) : null
    const diffDays = last ? Math.floor((now - last) / 86400000) : null

    if (!last || diffDays >= 1) {
      let streak = user?.streak_days || 0
      if (!last || diffDays >= 2) streak = 1
      else if (diffDays === 1) streak += 1

      const points = Math.min(10 + streak * 10, 100)
      await supabase.from('users').update({ last_login: now.toISOString(), streak_days: streak }).eq('id', userId)
      await supabase.rpc('increment_points', { user_id: userId, amount: points })
      await supabase.from('transactions').insert({
        user_id: userId, type: 'earn', source: 'daily_streak',
        points, description: `Day ${streak} streak bonus`
      })
    }

    window.location.href = 'dashboard.html'
  }
</script>
</body>
</html>
