<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2584816616413650"
     crossorigin="anonymous"></script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Grindpoint</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-box fade-up">
    <div class="auth-logo">
      <a href="index.html" class="logo">Grind<span>point</span></a>
    </div>
    <h2 class="auth-title">Welcome back</h2>
    <p class="auth-sub">Log in to continue earning.</p>

    <div id="verified-msg" class="alert alert-success"></div>
    <div id="error-msg" class="alert alert-error"></div>

    <div class="form-group">
      <label class="form-label">Email Address</label>
      <input type="email" id="email" class="form-input" placeholder="you@example.com"/>
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input type="password" id="password" class="form-input" placeholder="Your password"/>
    </div>

    <button class="btn btn-primary btn-block" id="login-btn">Log In</button>

    <hr class="divider"/>
    <p style="text-align:center;font-size:0.9rem;">Don't have an account? <a href="register.html">Sign up free</a></p>
  </div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

  // ── paste your actual values here ──
  const SUPABASE_URL = 'https://mygpknbimytjaynwfpdz.supabase.co'
  const SUPABASE_KEY = 'sb_publishable__m1skyZ-JbPLhg0AsERGOA_Z3AWjxOE'
  // ────────────────────────────────────

  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY)

  const btn = document.getElementById('login-btn')
  const errorEl = document.getElementById('error-msg')
  const verifiedEl = document.getElementById('verified-msg')

  // Show verified banner if redirected from email confirmation
  if (new URLSearchParams(window.location.search).get('verified')) {
    verifiedEl.textContent = '✅ Email verified! Log in to claim your welcome points.'
    verifiedEl.classList.add('show')
  }

  async function doLogin() {
    const email = document.getElementById('email').value.trim()
    const password = document.getElementById('password').value.trim()

    errorEl.classList.remove('show')

    if (!email || !password) {
      errorEl.textContent = 'Please enter your email and password.'
      errorEl.classList.add('show')
      return
    }

    btn.disabled = true
    btn.innerHTML = '<span class="spinner"></span> Logging in...'

    const { data, error } = await supabase.auth.signInWithPassword({ email, password })

    if (error) {
      errorEl.textContent = error.message.includes('Invalid login credentials')
        ? 'Incorrect email or password. Please try again.'
        : error.message
      errorEl.classList.add('show')
      btn.disabled = false
      btn.textContent = 'Log In'
      return
    }

    // Award daily streak
    try {
      const uid = data.user.id
      const { data: profile } = await supabase.from('users').select('last_login, streak_days').eq('id', uid).single()
      const now = new Date()
      const last = profile?.last_login ? new Date(profile.last_login) : null
      const diffDays = last ? Math.floor((now - last) / 86400000) : 999
      if (diffDays >= 1) {
        let streak = profile?.streak_days || 0
        streak = diffDays >= 2 ? 1 : streak + 1
        const pts = Math.min(10 + streak * 10, 100)
        await supabase.from('users').update({ last_login: now.toISOString(), streak_days: streak }).eq('id', uid)
        await supabase.rpc('increment_points', { user_id: uid, amount: pts })
        await supabase.from('transactions').insert({ user_id: uid, type: 'earn', source: 'daily_streak', points: pts, description: `Day ${streak} streak bonus` })
      }
    } catch (e) { console.log('Streak error (non-critical):', e) }

    window.location.href = 'dashboard.html'
  }

  btn.addEventListener('click', doLogin)
  document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin() })
</script>
</body>
</html>
